<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A fun KochiClassifieds redirect-style landing page." />
  <title>Looking for KochiClassifieds?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="card" aria-labelledby="page-title">
      <div class="eyebrow">Looking for something?</div>

      <h1 id="page-title">
        Are you looking for the
        <span>KochiClassifieds</span> website?
      </h1>

      <p class="intro">
        Okay... click the button below to go to KochiClassifieds 😄
      </p>

      <div class="button-placeholder" aria-hidden="true"></div>

      <div class="divider"><span>OR</span></div>

      <p class="normal-option">
        You can explore
        <a
          id="entebusiness-link"
          href="https://entebusiness.online/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Entebusiness.online
        </a>
      </p>

      <p class="hint">This link behaves normally. Promise.</p>
    </section>
  </main>

  <button
    id="runaway-button"
    class="runaway-button"
    type="button"
    aria-label="Click me to go to KochiClassifieds"
  >
    Click me
    <span aria-hidden="true">→</span>
  </button>


  <script src="script.js"></script>
</body>
</html>
